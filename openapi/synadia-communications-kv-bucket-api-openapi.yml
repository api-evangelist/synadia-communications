openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Kv Bucket API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: kv-bucket
paths:
  /core/beta/jetstream/kv-bucket/{streamId}:
    delete:
      description: Deletes KV Bucket
      operationId: deleteKvBucket
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete KV Bucket
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
    get:
      description: Returns JetStream KV bucket info
      operationId: getKvBucket
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSKVBucketViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get KV Bucket
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
    patch:
      operationId: updateKvBucket
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSKVBucketUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSKVBucketViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Update KV Bucket
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
  /core/beta/jetstream/kv-bucket/{streamId}/consumers:
    get:
      operationId: listKvConsumers
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSConsumerInfoListResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: List Consumers
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
  /core/beta/jetstream/kv-bucket/{streamId}/consumers/pull:
    post:
      description: Creates Pull Consumer
      operationId: createKvPullConsumer
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSPullConsumerConfigRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSPullConsumerInfoResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Create Pull Consumer
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
  /core/beta/jetstream/kv-bucket/{streamId}/consumers/push:
    post:
      description: Creates Push Consumer
      operationId: createKvPushConsumer
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSPushConsumerConfigRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSPushConsumerInfoResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Create Push Consumer
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: KV Buckets'
  /core/beta/jetstream/kv-bucket/{streamId}/purge:
    delete:
      description: Purges KV Bucket
      operationId: purgeKvBucket
      parameters:
      - explode: false
        in: path
        name: streamId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Purge KV Bucket
      tags:
      - kv-bucket
      x-doc-tags:
      - 'JetStream: Streams'
components:
