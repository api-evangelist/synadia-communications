openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Authz API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: authz
paths:
  /core/beta/authz/check:
    post:
      description: Returns applicable policies for calling session and requested service/resource
      operationId: check
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthzViewRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Check Authz Decisions
      tags:
      - authz
      x-doc-tags:
      - Authorization
  /core/beta/authz/policies:
    get:
      description: Returns a list of configured app policies
      operationId: listPolicies
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Policy List
      tags:
      - authz
      x-doc-tags:
      - Authorization
  /core/beta/authz/roles:
    get:
      description: Returns a list of configured app roles
      operationId: listRoles
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Authz roles List
      tags:
      - authz
      x-doc-tags:
      - Authorization
components:
  schemas:
    RoleListResponse:
      example:
        items:
        - scope: null
          name: name
          policies:
          - policies
          - policies
          description: description
          id: id
          sort_order: 0.8008281904610115
          enabled: true
        - scope: null
          name: name
          policies:
          - policies
          - policies
          description: description
          id: id
          sort_order: 0.8008281904610115
          enabled: true
      properties:
        items:
          items:
            $ref: '#/components/schemas/AppRole'
          type: array
      required:
      - items
      type: object
    AuthzResponse:
      example:
        operations:
        - operations
        - operations
        service: service
        resource_id: resource_id
      properties:
        operations:
          items:
            type: string
          type: array
        resource_id:
          type: string
        service:
          type: string
      required:
      - operations
      - resource_id
      - service
      type: object
    AuthzRequest:
      example:
        service: service
        resource_id: ''
      properties:
        resource_id:
          default: ''
          type: string
        service:
          type: string
      required:
      - resource_id
      - service
      type: object
    AuthzViewResponse:
      items:
        $ref: '#/components/schemas/AuthzResponse'
      type: array
    AuthzViewRequest:
      items:
        $ref: '#/components/schemas/AuthzRequest'
      type: array
    PolicyListResponse:
      example:
        items:
        - name: name
          description: description
          statements:
            key:
              resource:
              - resource
              - resource
              service: service
              effect:
              - null
              - null
              name: name
              action:
              - action
              - action
              operation_id: operation_id
          group: null
        - name: name
          description: description
          statements:
            key:
              resource:
              - resource
              - resource
              service: service
              effect:
              - null
              - null
              name: name
              action:
              - action
              - action
              operation_id: operation_id
          group: null
      properties:
        items:
          items:
            $ref: '#/components/schemas/AppPolicy'
          type: array
      required:
      - items
      type: object
    AppRoleEffect:
      enum:
      - ALLOW
      - DENY
      type: string
    AppRole:
      example:
        scope: null
        name: name
        policies:
        - policies
        - policies
        description: description
        id: id
        sort_order: 0.8008281904610115
        enabled: true
      properties:
        description:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        policies:
          items:
            type: string
          type: array
        scope:
          $ref: '#/components/schemas/AppRoleScope'
        sort_order:
          type: number
      required:
      - description
      - enabled
      - id
      - name
      - policies
      - scope
      - sort_order
      type: object
    AppPolicyGroup:
      enum:
      - Core
      - Cloud
      - Connectors
      - Workloads
      - SchemaRegistry
      - Insights
      type: string
    AppPolicy:
      example:
        name: name
        description: description
        statements:
          key:
            resource:
            - resource
            - resource
            service: service
            effect:
            - null
            - null
            name: name
            action:
            - action
            - action
            operation_id: operation_id
        group: null
      properties:
        description:
          type: string
        group:
          $ref: '#/components/schemas/AppPolicyGroup'
        name:
          type: string
        statements:
          additionalProperties:
            $ref: '#/components/schemas/AppPolicyStatement'
          type: object
      required:
      - group
      - name
      - statements
      type: object
    AppPolicyStatement:
      example:
        resource:
        - resource
        - resource
        service: service
        effect:
        - null
        - null
        name: name
        action:
        - action
        - action
        operation_id: operation_id
      properties:
        action:
          items:
            type: string
          type: array
        effect:
          items:
            $ref: '#/components/schemas/AppRoleEffect'
          type: array
        name:
          type: string
        operation_id:
          type: string
        resource:
          items:
            type: string
          type: array
        service:
          type: string
      required:
      - action
      - effect
      - name
      - resource
      type: object
    AppRoleScope:
      enum:
      - App
      - Team
      - System
      - Account
      - NatsUser
      type: string
  securitySchemes:
    bearerAuth:
      bearerFormat: Personal Access Token
      scheme: bearer
      type: http
    sessionAuth:
      in: cookie
      name: control_plane_session
      type: apiKey
