openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Sig Key API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: sig-key
paths:
  /core/beta/account-sks/{keyId}:
    delete:
      description: Deletes Account Signing
      operationId: deleteAccountSk
      parameters:
      - explode: false
        in: path
        name: keyId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete Account Signing
      tags:
      - sig-key
      x-doc-tags:
      - Signing Key Groups
    get:
      operationId: getAccountSk
      parameters:
      - explode: false
        in: path
        name: keyId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Account Signing
      tags:
      - sig-key
      x-doc-tags:
      - Signing Key Groups
    patch:
      operationId: updateAccountSk
      parameters:
      - explode: false
        in: path
        name: keyId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningKeyUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Update Account Signing
      tags:
      - sig-key
      x-doc-tags:
      - Signing Key Groups
components:
  schemas:
    SigningKeyUpdateRequest:
      example:
        seed: seed
        disabled: true
      properties:
        disabled:
          type: boolean
        seed:
          type: string
      type: object
    SigningKeyViewResponse:
      example:
        public_key: public_key
        current: true
        missing_seed: true
        group_id: group_id
        created: 2000-01-23 04:56:07+00:00
        disabled_at: 2000-01-23 04:56:07+00:00
        rotated: true
        disabled: true
        id: id
        rotated_at: 2000-01-23 04:56:07+00:00
      properties:
        created:
          format: date-time
          type: string
        current:
          type: boolean
        disabled:
          type: boolean
        disabled_at:
          format: date-time
          type: string
        group_id:
          type: string
        id:
          type: string
        missing_seed:
          type: boolean
        public_key:
          type: string
        rotated:
          type: boolean
        rotated_at:
          format: date-time
          type: string
      required:
      - created
      - current
      - disabled
      - group_id
      - id
      - missing_seed
      - public_key
      - rotated
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Personal Access Token
      scheme: bearer
      type: http
    sessionAuth:
      in: cookie
      name: control_plane_session
      type: apiKey
