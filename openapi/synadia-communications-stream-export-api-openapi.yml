openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Stream Export API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: stream-export
paths:
  /core/beta/stream-exports/{streamExportId}:
    delete:
      operationId: deleteStreamExport
      parameters:
      - explode: false
        in: path
        name: streamExportId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete Stream Export
      tags:
      - stream-export
      x-doc-tags:
      - Sharing
    get:
      description: Returns Stream Export info
      operationId: getStreamExport
      parameters:
      - explode: false
        in: path
        name: streamExportId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamExportViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Stream Export
      tags:
      - stream-export
      x-doc-tags:
      - Sharing
  /core/beta/stream-exports/{streamExportId}/shares:
    get:
      description: List stream shares for this export
      operationId: listStreamShares
      parameters:
      - explode: false
        in: path
        name: streamExportId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamShareListResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: List Stream Shares
      tags:
      - stream-export
      x-doc-tags:
      - Sharing
    post:
      description: Creates Stream Shares
      operationId: createStreamShares
      parameters:
      - explode: false
        in: path
        name: streamExportId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamShareCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamShareViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Create Stream Shares
      tags:
      - stream-export
      x-doc-tags:
      - Sharing
  /core/beta/stream-exports/{streamExportId}/shares/{targetAccountNKeyPublic}:
    delete:
      description: Revokes the share for provided Account NKey
      operationId: deleteStreamShare
      parameters:
      - explode: false
        in: path
        name: streamExportId
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: targetAccountNKeyPublic
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete Stream Share
      tags:
      - stream-export
      x-doc-tags:
      - Sharing
components:
  schemas:
    StreamExportViewResponse:
      description: '/

        Stream export

        /'
      example:
        account_id: account_id
        stream_name: stream_name
        created: 2000-01-23 04:56:07+00:00
        js_subject_prefix: js_subject_prefix
        is_public: true
        deliver_subject_prefix: deliver_subject_prefix
        id: id
      properties:
        account_id:
          type: string
        created:
          format: date-time
          type: string
        deliver_subject_prefix:
          type: string
        id:
          type: string
        is_public:
          type: boolean
        js_subject_prefix:
          type: string
        stream_name:
          type: string
      required:
      - account_id
      - created
      - deliver_subject_prefix
      - id
      - is_public
      - js_subject_prefix
      - stream_name
      type: object
    StreamShareListResponse:
      example:
        items:
        - target_account_nkey_public: target_account_nkey_public
        - target_account_nkey_public: target_account_nkey_public
      properties:
        items:
          items:
            $ref: '#/components/schemas/StreamShareViewResponse'
          type: array
      required:
      - items
      type: object
    StreamShareCreateRequest:
      description: '/

        Stream Share

        /'
      example:
        target_account_nkey_public: target_account_nkey_public
      properties:
        target_account_nkey_public:
          type: string
      required:
      - target_account_nkey_public
      type: object
    StreamShareViewResponse:
      example:
        target_account_nkey_public: target_account_nkey_public
      properties:
        target_account_nkey_public:
          type: string
      required:
      - target_account_nkey_public
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Personal Access Token
      scheme: bearer
      type: http
    sessionAuth:
      in: cookie
      name: control_plane_session
      type: apiKey
