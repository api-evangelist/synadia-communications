openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Stream Import API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: stream-import
paths:
  /core/beta/stream-imports/{streamImportId}:
    delete:
      operationId: deleteStreamImport
      parameters:
      - explode: false
        in: path
        name: streamImportId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete Stream Import
      tags:
      - stream-import
      x-doc-tags:
      - Sharing
    get:
      description: Returns Stream Import
      operationId: getStreamImport
      parameters:
      - explode: false
        in: path
        name: streamImportId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamImportViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get Stream Import
      tags:
      - stream-import
      x-doc-tags:
      - Sharing
components:
  schemas:
    StreamImportViewResponse:
      description: '/

        Stream Import

        /'
      example:
        remote_account_nkey_public: remote_account_nkey_public
        account_id: account_id
        deliver_subject: deliver_subject
        stream_name: stream_name
        created: 2000-01-23 04:56:07+00:00
        js_subject_prefix: js_subject_prefix
        id: id
      properties:
        account_id:
          type: string
        created:
          format: date-time
          type: string
        deliver_subject:
          type: string
        id:
          type: string
        js_subject_prefix:
          type: string
        remote_account_nkey_public:
          type: string
        stream_name:
          type: string
      required:
      - account_id
      - created
      - deliver_subject
      - id
      - js_subject_prefix
      - remote_account_nkey_public
      - stream_name
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: Personal Access Token
      scheme: bearer
      type: http
    sessionAuth:
      in: cookie
      name: control_plane_session
      type: apiKey
