          config_mode: true
          server_urls: server_urls
          user_jwt_expires_in_secs: 7
          jetstream_tiers:
          - jetstream_tiers
          - jetstream_tiers
          name: name
          id: id
          state: null
          jetstream_domain: jetstream_domain
        jwt_settings:
          bearer_token: true
          data: 2147483647
          payload: 2147483647
          subs: 2147483647
          allowed_connection_types:
          - allowed_connection_types
          - allowed_connection_types
          tags:
          - tags
          - tags
        claims:
          nats:
            issuer_account: issuer_account
        name: name
        jwt_expires_in_secs: 1
        id: id
        account:
          user_jwt: user_jwt
          auth_type: null
          user_cred: user_cred
          account_public_key: account_public_key
          name: name
          user_jwt_expires_in_secs: 0
          id: id
          is_platform_account: true
          is_scp_account: true
          is_system_account: true
      properties:
        account:
          $ref: '#/components/schemas/AccountInfo'
        claims:
          $ref: '#/components/schemas/UserClaims'
        created:
          format: date-time
          type: string
        id:
          type: string
        jwt:
