          type: integer
      required:
      - auth_type
      - id
      - is_platform_account
      - is_scp_account
      - is_system_account
      - name
      - user_jwt_expires_in_secs
      type: object
    SystemManagedBy:
      enum:
      - byon
      - sdkube
      type: string
    SigningKeyGroupCopyRequest:
      example:
        name: name
      properties:
        name:
          type: string
      required:
      - name
      type: object
    UserPermissionLimits:
      allOf:
      - $ref: '#/components/schemas/Permissions'
      - $ref: '#/components/schemas/UserLimits'
      - $ref: '#/components/schemas/NatsLimits'
      example:
        bearer_token: true
        allowed_connection_types:
        - allowed_connection_types
        - allowed_connection_types
      properties:
        allowed_connection_types:
          items:
            type: string
          type: array
        bearer_token:
          type: boolean
      type: object
    SystemConnectionType:
      default: Agent
      enum:
      - Agent
      - Direct
      type: string
    NatsUserViewResponse:
      example:
        sk_group_id: sk_group_id
        user_public_key: user_public_key
        created: 2000-01-23 04:56:07+00:00
        jwt: jwt
        team:
          name: name
          id: id
        jwt_expires_at_max: 6
        system:
