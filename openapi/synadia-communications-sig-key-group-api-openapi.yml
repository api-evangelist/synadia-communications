          type: integer
        times:
          items:
            $ref: '#/components/schemas/NatsUserJwtSettingsPatch_times_inner'
          type:
          - array
          - 'null'
        times_location:
          type:
          - string
          - 'null'
      type: object
    ResponsePermissionPatch:
      properties:
        max:
          type: integer
        ttl:
          format: int64
          type: integer
      type: object
    SigningKeyGroupUpdateRequest:
      example:
        scope:
          sub: null
          bearer_token: true
          times:
          - start: start
            end: end
          - start: start
            end: end
          times_location: times_location
          data: 0
          payload: 6
          resp: null
          src:
          - src
          - src
          subs: 1
          allowed_connection_types:
          - allowed_connection_types
          - allowed_connection_types
          pub: null
        name: name
        disabled: true
      properties:
        disabled:
          type: boolean
        name:
          type: string
        scope:
          $ref: '#/components/schemas/UserPermissionLimitsPatch'
      type: object
    TeamInfo:
      example:
        name: name
        id: id
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
    NatsUserJwtSettingsPatch_resp:
      allOf:
      - $ref: '#/components/schemas/ResponsePermissionPatch'
      type:
      - object
      - 'null'
    AccountInfo:
      example:
        user_jwt: user_jwt
        auth_type: null
        user_cred: user_cred
        account_public_key: account_public_key
        name: name
        user_jwt_expires_in_secs: 0
        id: id
        is_platform_account: true
        is_scp_account: true
        is_system_account: true
      properties:
        account_public_key:
          type: string
        auth_type:
          $ref: '#/components/schemas/AccountAuthType'
        id:
