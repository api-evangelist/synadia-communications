openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud Oidc Provider API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: Oidc Provider
paths:
  /core/beta/oidc-providers:
    get:
      description: Returns a list of OIDC providers
      operationId: listOidcProviders
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderListResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: List OIDC Providers
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
    post:
      description: Creates a new OIDC provider
      operationId: createOidcProvider
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderAddRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Create OIDC Provider
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
  /core/beta/oidc-providers/{oidcProviderId}:
    delete:
      description: Deletes an OIDC provider
      operationId: deleteOidcProvider
      parameters:
      - explode: false
        in: path
        name: oidcProviderId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete OIDC Provider
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
    get:
      description: Returns an OIDC provider by ID
      operationId: getOidcProvider
      parameters:
      - explode: false
        in: path
        name: oidcProviderId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get OIDC Provider
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
    patch:
      description: Updates an OIDC provider
      operationId: updateOidcProvider
      parameters:
      - explode: false
        in: path
        name: oidcProviderId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OidcProviderUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcProviderViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Update OIDC Provider
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
  /core/beta/oidc-providers/defaults:
    get:
      description: Returns a list of OIDC provider defaults
      operationId: listOidcDefaultProvider
      responses:
        '200':
          content:
            application/json:
              schema:
