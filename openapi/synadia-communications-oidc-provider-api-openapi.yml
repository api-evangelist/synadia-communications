          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: List OIDC Provider Defaults
      tags:
      - Oidc Provider
      x-doc-tags:
      - OIDC Providers
