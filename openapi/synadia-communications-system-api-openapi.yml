openapi: 3.2.0
info:
  description: API for Synadia Control Plane / Synadia Cloud
  title: Synadia Control Plane / Synadia Cloud System API
  version: beta
servers:
- description: Path to Synadia Control Plane Server Api
  url: '{baseUrl}/api'
  variables:
    baseUrl:
      default: ''
security:
- bearerAuth: []
  sessionAuth: []
tags:
- name: System
paths:
  /core/beta/systems/{systemId}:
    delete:
      description: Deletes System
      operationId: deleteSystem
      parameters:
      - explode: false
        in: path
        name: systemId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Delete System
      tags:
      - System
      x-doc-tags:
      - Systems
    get:
      description: Returns a System by ID
      operationId: getSystem
      parameters:
      - explode: false
        in: path
        name: systemId
        required: true
        schema:
          type: string
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Get System
      tags:
      - System
      x-doc-tags:
      - Systems
    patch:
      description: Updates a System
      operationId: updateSystem
      parameters:
      - explode: false
        in: path
        name: systemId
        required: true
        schema:
          type: string
        style: simple
      - description: To test the backend connection without updating the system, pass test_connection=true in query parameter.
        explode: true
        in: query
        name: test_connection
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemViewResponse'
          description: Success
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      summary: Update System
      tags:
      - System
      x-doc-tags:
      - Systems
