name: Synadia Communications client libraries and SDKs
description: >-
  Two distinct package families. FIRST-PARTY SYNADIA packages (synadia-io GitHub org) wrap the
  commercial Control Plane / Synadia Cloud API and the Connect and Nex products. NATS.IO CLIENT
  LIBRARIES (nats-io GitHub org) speak the NATS wire protocol that Synadia Cloud serves; Synadia
  created NATS and remains its primary maintainer, but NATS is a CNCF project under Apache 2.0 and
  these packages are published by the project, not by Synadia as a vendor. They are marked
  official:false with that stewardship recorded, so a reader is not told Synadia ships an SDK it
  does not own.
currency_note: >-
  The first-party Control Plane Go SDK (v0.9.0, 2026-07-24) is the only client generated from the
  Control Plane OpenAPI, and it is current. There is NO first-party SDK in any other language for
  the Control Plane API, and no SDK at all for the NATS HTTP Gateway API - HTTP Gateway consumers
  write raw HTTP calls. The legacy npm `nats` package (2.29.3, 2025-03-19) is superseded by the
  scoped @nats-io/* v3 packages (3.4.0, 2026-05-08) and is the one visibly decaying entry.
