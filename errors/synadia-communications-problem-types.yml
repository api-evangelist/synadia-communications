agent_guidance: >-
  Because the Control Plane declares no error body, an agent must parse errors defensively: read the
  HTTP status as the primary signal and treat the body as untyped. Do not assume a `message` or
  `error` field is present. On the HTTP Gateway, prefer the typed `Error` schema.
gaps:
- No RFC 9457 problem+json on either API.
- No documented error code vocabulary or remediation reference on docs.synadia.com.
- No 429 declared, consistent with no published rate limits.
- Control Plane error responses carry no schema, so 245 operations are effectively untyped on failure.
