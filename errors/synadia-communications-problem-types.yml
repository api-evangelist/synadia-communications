name: Synadia Communications error catalog
description: >-
  The two Synadia APIs handle errors very differently, and the difference matters to an agent. The
  Control Plane declares 400/401/403/404 on all 245 operations with bare one-word descriptions and NO
  content block at all - no media type, no schema - so a client cannot know what an error body looks
  like from the contract. The HTTP Gateway is materially better: 15 of its error responses bind
  application/json to a real `Error` schema. Neither API uses RFC 9457 application/problem+json, and
  neither declares a 429 or any 5xx.
