name: Synadia Cloud plans and pricing
description: >-
  Synadia Cloud publishes a full public pricing table with four tiers and per-tier resource quotas,
  plus explicit network-data overage rates. Quotas are expressed in NATS terms - accounts,
  connections, subscriptions per connection, leaf nodes, streams, consumers, storage - rather than
  API call counts, because the metered product is the messaging fabric, not the control-plane API.
  The Control Plane API and HTTP Gateway are included with every tier and are not separately priced
  or metered.
