name: Synadia Communications data model
description: >-
  Synadia's control plane has an unusually legible containment hierarchy, readable directly from its
  URL structure: a Team owns Systems, a System owns Accounts, and an Account is the isolation boundary
  that owns NATS Users, JetStream resources, and the import/export grants that let one account share
  subjects and streams with another. JetStream itself is a sub-namespace of an Account holding four
  peer resource families - Streams, KV Buckets, Object Buckets and Mirrors - each of which owns
  Consumers. The HTTP Gateway exposes a much smaller, flatter model: Buckets holding Values or Objects.
entities:
- name: Team
  path: /core/beta/teams/{teamId}
  description: Billing and collaboration boundary. Owns systems, app users and service accounts.
- name: System
  path: /core/beta/systems/{systemId}
  description: >-
    An isolated NATS deployment across one or more regions. Owns accounts, agent tokens, auth callout
    configuration, alert rules, platform components, health and audit surfaces.
- name: Account
  path: /core/beta/accounts/{accountId}
  description: >-
    The NATS security and isolation boundary. Owns NATS users, JetStream resources, signing key
    groups, imports and exports, alert rules and connection/metrics views.
- name: NatsUser
  path: /core/beta/nats-users/{userId}
  description: A NATS client identity within an account; the subject of credential issuance and rotation.
- name: Stream
  path: /core/beta/accounts/{accountId}/jetstream/streams
  description: A JetStream persisted message stream. Owns consumers.
- name: KvBucket
  path: /core/beta/accounts/{accountId}/jetstream/kv-buckets
  description: A JetStream key-value bucket. Backed by a stream, so it also owns consumers.
- name: ObjectBucket
  path: /core/beta/accounts/{accountId}/jetstream/object-buckets
  description: A JetStream object store bucket. Backed by a stream, so it also owns consumers.
- name: Mirror
  path: /core/beta/accounts/{accountId}/jetstream/mirrors
  description: A mirrored copy of a stream, typically in another region or account. Owns consumers.
- name: Consumer
  path: /core/beta/.../consumers
  description: >-
    A pull or push subscription over a stream-backed resource. Distinct sub-shapes exist for pull
    (/consumers/pull) and push (/consumers/push).
- name: AccountSkGroup
  path: /core/beta/account-sk-groups/{groupId}
  description: A group of account signing keys; the unit of key rotation and NATS user assignment.
- name: AuthCallout
  path: /core/beta/systems/{systemId}/auth-callout
  description: Delegated authentication configuration, with target accounts and users.
- name: StreamExport / SubjectExport
  path: /core/beta/accounts/{accountId}/stream-exports, /subject-exports
  description: Grants that publish an account's streams or subjects to other accounts, via shares.
- name: StreamImport / SubjectImport
  path: /core/beta/accounts/{accountId}/stream-imports, /subject-imports
  description: The receiving half of a share, binding another account's export into this account.
- name: AppUser
  path: /core/beta/teams/{teamId}/app-users
  description: A human console user, distinct from a NatsUser. Carries roles.
- name: ServiceAccount
  path: /core/beta/service-accounts
  description: Machine identity at team or app scope, with its own token collection.
- name: PersonalAccessToken
  path: /core/beta/personal-access-tokens
  description: The bearer credential used to call the Control Plane API itself.
- name: Bucket
  surface: http-gateway
  description: HTTP Gateway view of a KV or object bucket, addressed by name.
- name: Value / ObjectInfo
  surface: http-gateway
  description: An entry within a KV bucket (Value) or object bucket (ObjectInfo), addressed by key.
