apis:
- aid: synadia-communications-control-plane
  name: Synadia Control Plane / Synadia Cloud API
  description: 'The REST control-plane API behind Synadia Cloud and the self-hosted Synadia Control Plane.
    245 operations across 158 paths manage systems, accounts, teams, NATS users, JetStream streams,
    consumers, key-value and object buckets, mirrors, imports/exports, signing key groups, auth callout,
    OIDC providers, alerts, workloads and licensing. Authenticated with a Personal Access Token as an HTTP
    bearer token, or a session cookie in the console.'
  humanURL: https://cloud.synadia.com/api-docs
