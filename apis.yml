- aid: synadia-communications-http-gateway
  name: Synadia Cloud NATS HTTP Gateway
  description: 'A first-class RESTful HTTP interface to NATS, hosted by Synadia Cloud at api.ngs.global.
    30 operations expose the NATS key-value store and its management surface, the object store and its
    management surface, and core NATS publish, request and subscribe against any subject over HTTP.
    Authenticated with an API token scoped to a User within an Account, passed in the Authorization header.'
  humanURL: https://docs.synadia.com/cloud/resources/http-gateway
