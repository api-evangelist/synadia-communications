name: Synadia Communications MCP surface
description: >-
  Synadia ships NO Model Context Protocol server. This is a derived candidate only. Every NATS MCP
  server found in the search is third-party and unaffiliated - sinadarbouy/mcp-nats,
  JaredCluff/nuntius, gooseus/mcp-nats - none is published by Synadia and none is listed in Synadia's
  own Agent Skills registry or llms.txt. Notably, Synadia HAS invested in the agent-readiness layer,
  just not through MCP: it publishes an agent-skills registry, an llms.txt, an RFC 9727 api-catalog
  and Markdown twins of every page. The MCP-shaped gap is therefore a deliberate-looking absence, not
  a provider that ignored agents.
