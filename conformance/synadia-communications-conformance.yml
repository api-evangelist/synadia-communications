    url: https://docs.synadia.com/platform/sbom
    note: Synadia Platform publishes an SBOM section in its documentation.
  - name: FIPS builds
    note: >-
      FIPS-validated builds are offered as a Synadia Platform deployment option, per the provider's
      own synadia-platform-deployment Agent Skill.
