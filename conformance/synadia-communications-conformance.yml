    status: achieved
    source: https://www.synadia.com/blog/synadia-soc2-compliant
    note: >-
      Announced via the Synadia blog. No trust center portal, no downloadable report gate, and no
      SOC 2 Type 2, ISO 27001, PCI or FedRAMP claim was found on any Synadia surface.
  privacy:
  - name: Data Processing Addendum
    url: https://www.synadia.com/legal/dpa
  - name: Subprocessors list
    url: https://www.synadia.com/legal/subprocessors
    status: 200
  supply_chain:
